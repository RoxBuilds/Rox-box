# The Rox-box Launcher: a small window over victory.exe and scripts\play.ps1.
#
# A workspace of its own on purpose: it is not a member of the repository's
# workspace, shares no dependency with the engine crates and is built on its
# own (`cargo build --release` in this folder), so work on the engine and
# work here never meet in one file.
[workspace]

[package]
name = "roxbox-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false
description = "A portable window over Rox-box: title folders, launch, preflight, maintenance"

[[bin]]
name = "roxbox-launcher"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.15", default-features = false }
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
