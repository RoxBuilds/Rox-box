name: Build

# Every push and pull request to main: the hermetic distribution build,
# packaged as players download it, kept as a workflow artifact.
# A tag `v*`: the same package, published as a GitHub Release.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The engine's workspace, and the launcher's own (launcher\), which the package step builds too.
          workspaces: |
            . -> target
            launcher -> target
      # A release tag must name the version being built.
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?ms)^\[workspace\.package\]\s*$.*?^\s*version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Host "::error::tag $env:GITHUB_REF_NAME does not match the workspace version $version (Cargo.toml)"
            exit 1
          }
      # The installer is built with Inno Setup 6 (dist\installer\rox-box.iss).
      # The hosted image usually has it; if not, a pinned version is installed.
      - name: Inno Setup
        shell: pwsh
        run: |
          $known = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not ($known | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --version 6.4.3 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $found = @($known | Where-Object { Test-Path -LiteralPath $_ })
          if ($found.Count -gt 0) { & $found[0] /? | Select-Object -First 2 } else { iscc.exe /? | Select-Object -First 2 }
      # Builds `cargo xtask dist`, checks hermeticity, the imported DLLs and
      # the license file, and writes dist\Rox-box-<version>-windows-x64.zip
      # and, with -Installer (an error without Inno Setup), the setup program
      # dist\Rox-box-<version>-windows-x64-setup.exe, each with its .sha256.
      - name: Package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\package-release.ps1 -Installer
      # The package as a player gets it: unzipped elsewhere, nothing of the
      # checkout beside it.
      - name: Try the package
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\Rox-box-*-windows-x64.zip).FullName
          $to = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive -LiteralPath $zip -DestinationPath $to
          Set-Location (Get-ChildItem -LiteralPath $to -Directory)[0].FullName
          .\victory.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\victory.exe config
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # No game folder and no graphics card here: the report is what is tried.
          .\victory.exe check
          # The frame path with the binary as shipped, on the software adapter
          # (docs/selftest.md): the hosted runners' adapter has shader model 6.6
          # and runs every stage, so a stage that fails here fails the build.
          # The rates are for reading in the log; nothing is compared yet.
          .\victory.exe selftest --warp --bench
          if ($LASTEXITCODE -ne 0) { Write-Host "selftest exit code: $LASTEXITCODE"; exit 1 }
          exit 0
      # The installer as a player gets it: a silent per-user install (no admin
      # rights) into a folder with spaces and non-ASCII letters, the installed
      # program run, an upgrade over it, then the uninstall. The player's own
      # files (victory.toml, local\, the saves under %LOCALAPPDATA%\victory)
      # must survive both the upgrade and the uninstall.
      - name: Try the installer
        shell: pwsh
        run: |
          function Fail([string]$why) { Write-Host "::error::$why"; exit 1 }
          function Run-Quiet([string]$exe, [string[]]$arguments) {
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { Fail "$exe $arguments exited with $($p.ExitCode)" }
          }
          $setup = (Get-ChildItem dist\Rox-box-*-windows-x64-setup.exe).FullName
          if (-not $setup) { Fail 'no setup program in dist' }
          $sums = (Get-Content -LiteralPath "$setup.sha256" -Raw).Trim()
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sums -ne "$hash  $(Split-Path -Leaf $setup)") { Fail "the .sha256 does not match the setup program: $sums" }
          $inst = Join-Path $env:RUNNER_TEMP "Inst $([char]0xDC)n$([char]0xEF)code Folder\Rox-box"
          $setupArgs = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=`"$inst`""
          Run-Quiet $setup $setupArgs
          foreach ($f in 'victory.exe', 'roxbox-launcher.exe', 'play.cmd', 'play.ps1', 'victory.example.toml', 'QUICKSTART.txt', 'LICENSE', 'THIRD_PARTY_LICENSES.md', 'unins000.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $inst $f))) { Fail "the installed folder has no $f" }
          }
          Set-Location -LiteralPath $inst
          .\victory.exe --version
          if ($LASTEXITCODE -ne 0) { Fail 'victory.exe --version failed' }
          .\victory.exe config
          if ($LASTEXITCODE -ne 0) { Fail 'victory.exe config failed' }
          .\victory.exe selftest --warp
          if ($LASTEXITCODE -ne 0) { Fail "selftest exit code: $LASTEXITCODE" }
          # The launcher finds the engine beside it (its output goes through a file: a windowed program has no console).
          $probeOut = Join-Path $env:RUNNER_TEMP 'installed-probe.txt'
          $env:ROXBOX_HOME = $null
          $probe = Start-Process -FilePath (Join-Path $inst 'roxbox-launcher.exe') -ArgumentList '--probe' -WorkingDirectory $inst -RedirectStandardOutput $probeOut -NoNewWindow -Wait -PassThru
          $probeSaid = [System.IO.File]::ReadAllText($probeOut)
          if ($probe.ExitCode -ne 0 -or $probeSaid -notmatch '(?m)^home: Release' -or $probeSaid -notmatch '(?m)^victory\.exe: true') { Fail "the installed launcher did not find the engine (exit $($probe.ExitCode)): $probeSaid" }
          # The player's own files, and a "save" under %LOCALAPPDATA%\victory.
          Set-Content -LiteralPath (Join-Path $inst 'victory.toml') -Value '# mine'
          New-Item -ItemType Directory -Force -Path (Join-Path $inst 'local') | Out-Null
          Set-Content -LiteralPath (Join-Path $inst 'local\keep.txt') -Value 'keep'
          $save = Join-Path $env:LOCALAPPDATA 'victory\data\saves-test'
          New-Item -ItemType Directory -Force -Path $save | Out-Null
          Set-Content -LiteralPath (Join-Path $save 'keep.txt') -Value 'save'
          # Upgrade: the same setup again over it. A deleted program file comes back, the player's files stay.
          Remove-Item -LiteralPath (Join-Path $inst 'play.cmd')
          Run-Quiet $setup $setupArgs
          if (-not (Test-Path -LiteralPath (Join-Path $inst 'play.cmd'))) { Fail 'the upgrade did not restore play.cmd' }
          foreach ($f in 'victory.toml', 'local\keep.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $inst $f))) { Fail "the upgrade removed $f" }
          }
          # Uninstall, silent: the program is gone, the player's files are not.
          Set-Location $env:RUNNER_TEMP
          Run-Quiet (Join-Path $inst 'unins000.exe') '/VERYSILENT', '/SUPPRESSMSGBOXES'
          for ($i = 0; $i -lt 30 -and (Test-Path -LiteralPath (Join-Path $inst 'victory.exe')); $i++) { Start-Sleep -Seconds 1 }
          foreach ($f in 'victory.exe', 'roxbox-launcher.exe', 'play.cmd', 'play.ps1', 'victory.example.toml', 'QUICKSTART.txt', 'LICENSE', 'THIRD_PARTY_LICENSES.md', 'unins000.exe') {
            if (Test-Path -LiteralPath (Join-Path $inst $f)) { Fail "the uninstall left $f" }
          }
          foreach ($f in 'victory.toml', 'local\keep.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $inst $f))) { Fail "the uninstall removed $f" }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $save 'keep.txt'))) { Fail 'the uninstall touched %LOCALAPPDATA%\victory' }
          Remove-Item -LiteralPath $save -Recurse -Force
          exit 0
      # The self-test's rates (median, minimum, maximum of five runs) and one run
      # of the open demo title, from the packaged binary, kept as numbers: a
      # person comparing two runs' `bench` artifacts sees a slowdown that the
      # pass/fail steps do not. It records and never fails on a figure (shared
      # runners are too noisy for a limit); it fails only when a run itself
      # fails. Comparing with the base commit's artifact needs a cross-run
      # download with a token, which is not built yet (docs/selftest.md).
      - name: Record the benchmark
        shell: pwsh
        run: |
          # The demo title and its two DLLs, put together as its game folder
          # (docs/demo-title.md): the twin is the late DLL under a second name.
          foreach ($f in 'demo-title', 'demo-static-dll', 'demo-late-dll') {
            cargo build --locked --manifest-path tests\fixtures\$f\Cargo.toml --target-dir target\$f
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $game = Join-Path $env:RUNNER_TEMP 'demo-game'
          New-Item -ItemType Directory -Force -Path $game | Out-Null
          Copy-Item target\demo-title\debug\demo-title.exe $game
          Copy-Item target\demo-static-dll\debug\demo_static.dll $game
          Copy-Item target\demo-late-dll\debug\demo_late.dll $game
          Copy-Item target\demo-late-dll\debug\demo_late.dll (Join-Path $game 'demo_twin.dll')
          # The script's own tests first: its parsing and comparison need no victory.exe.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\bench-record.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $unzipped = (Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'unzipped') -Directory)[0].FullName
          $out = Join-Path $env:RUNNER_TEMP 'bench'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\bench-record.ps1 -Victory (Join-Path $unzipped 'victory.exe') -Out $out -DemoTitle (Join-Path $game 'demo-title.exe')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content -LiteralPath (Join-Path $out 'bench.md') -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      # The two files, for comparing with another run's by hand.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench
          path: |
            ${{ runner.temp }}/bench/bench.json
            ${{ runner.temp }}/bench/bench.md
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rox-box-windows-x64
          path: |
            dist/Rox-box-*-windows-x64.zip
            dist/Rox-box-*-windows-x64.zip.sha256
            dist/Rox-box-*-windows-x64-setup.exe
            dist/Rox-box-*-windows-x64-setup.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Rox-box-windows-x64
          path: dist
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = (Get-ChildItem dist\Rox-box-*-windows-x64.zip*, dist\Rox-box-*-windows-x64-setup.exe*).FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Rox-box $env:GITHUB_REF_NAME" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
