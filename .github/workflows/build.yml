name: Build

# Every push and pull request to main: the hermetic distribution build,
# packaged as players download it, kept as a workflow artifact.
# A tag `v*`: the same package, published as a GitHub Release.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A release tag must name the version being built.
      - name: Tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?ms)^\[workspace\.package\]\s*$.*?^\s*version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Host "::error::tag $env:GITHUB_REF_NAME does not match the workspace version $version (Cargo.toml)"
            exit 1
          }
      # Builds `cargo xtask dist`, checks hermeticity, the imported DLLs and
      # the license file, and writes dist\Rox-box-<version>-windows-x64.zip.
      - name: Package
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\package-release.ps1
      # The package as a player gets it: unzipped elsewhere, nothing of the
      # checkout beside it.
      - name: Try the package
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\Rox-box-*-windows-x64.zip).FullName
          $to = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive -LiteralPath $zip -DestinationPath $to
          Set-Location (Get-ChildItem -LiteralPath $to -Directory)[0].FullName
          .\victory.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\victory.exe config
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # No game folder and no graphics card here: the report is what is tried.
          .\victory.exe check
          # The frame path with the binary as shipped, on the software adapter
          # (docs/selftest.md): the hosted runners' adapter has shader model 6.6
          # and runs every stage, so a stage that fails here fails the build.
          # The rates are for reading in the log; nothing is compared yet.
          .\victory.exe selftest --warp --bench
          if ($LASTEXITCODE -ne 0) { Write-Host "selftest exit code: $LASTEXITCODE"; exit 1 }
          exit 0
      # The self-test's rates (median, minimum, maximum of five runs) and one run
      # of the open demo title, from the packaged binary, kept as numbers: a
      # person comparing two runs' `bench` artifacts sees a slowdown that the
      # pass/fail steps do not. It records and never fails on a figure (shared
      # runners are too noisy for a limit); it fails only when a run itself
      # fails. Comparing with the base commit's artifact needs a cross-run
      # download with a token, which is not built yet (docs/selftest.md).
      - name: Record the benchmark
        shell: pwsh
        run: |
          cargo build --locked --manifest-path tests\fixtures\demo-title\Cargo.toml --target-dir target\demo-title
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The script's own tests first: its parsing and comparison need no victory.exe.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\bench-record.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $unzipped = (Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'unzipped') -Directory)[0].FullName
          $out = Join-Path $env:RUNNER_TEMP 'bench'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\bench-record.ps1 -Victory (Join-Path $unzipped 'victory.exe') -Out $out -DemoTitle (Resolve-Path target\demo-title\debug\demo-title.exe).Path
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content -LiteralPath (Join-Path $out 'bench.md') -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      # The two files, for comparing with another run's by hand.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench
          path: |
            ${{ runner.temp }}/bench/bench.json
            ${{ runner.temp }}/bench/bench.md
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rox-box-windows-x64
          path: |
            dist/Rox-box-*-windows-x64.zip
            dist/Rox-box-*-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Rox-box-windows-x64
          path: dist
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = (Get-ChildItem dist\Rox-box-*-windows-x64.zip*).FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Rox-box $env:GITHUB_REF_NAME" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
