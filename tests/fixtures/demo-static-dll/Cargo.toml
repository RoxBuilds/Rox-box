# The DLL the open demo title imports (docs/demo-title.md, "Its DLLs"):
# `demo_static.dll`, which a game folder holds beside `demo-title.exe`, so
# that `victory run` maps it as the title's own DLL, binds its imports and
# runs its `DllMain` before the title's entry point. NOT a workspace member:
# `apps/victory/tests/demo_title.rs` builds it on demand into its own target
# directory, like the demo title. It depends on no crate.
[package]
name = "demo-static-dll"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "demo_static"
crate-type = ["cdylib"]

# Nothing may unwind out of `DllMain` or an export.
[profile.dev]
panic = "abort"

[workspace]
